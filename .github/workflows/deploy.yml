name: Deploy to Azure App Service

# Continuous Deployment for Swiftcart.
#   - Node.js app (Express + React build)  ->  App Service  vt-nodeapp-01
#   - PHP documentation app                ->  App Service  vt-phpapp-02
# Both apps live in resource group vt-nodejs-rg.
#
# Auth: OpenID Connect (OIDC) — no stored password. Uses the repository secrets
#   AZURE_CLIENT_ID        (service principal / app registration client id)
#   AZURE_TENANT_ID        (Entra ID tenant id)
#   AZURE_SUBSCRIPTION_ID  (subscription that hosts the App Services)
#
# Trigger: this deploy is GATED on the CI workflow. It runs automatically only
# after the "CI" workflow completes successfully on `main` (workflow_run), and
# deploys the exact commit that CI validated. You can also start it manually
# (workflow_dispatch) — a manual run skips the CI-success gate on purpose.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# OIDC needs permission to request a federated token.
permissions:
  id-token: write
  contents: read

env:
  NODE_WEBAPP_NAME: vt-nodeapp-01
  PHP_WEBAPP_NAME: vt-phpapp-02
  RESOURCE_GROUP: vt-nodejs-rg
  # Public URL of the Node app; used for the PHP docs' BASE_URL/PORTAL_URL and
  # the Node app's own CORS FRONTEND_ORIGIN. Change if you use a custom domain.
  NODE_APP_URL: https://vt-nodeapp-01.azurewebsites.net

jobs:
  # ---------------------------------------------------------------------------
  # Node.js app  ->  vt-nodeapp-01
  # ---------------------------------------------------------------------------
  deploy-node:
    name: Deploy Node app (vt-nodeapp-01)
    runs-on: self-hosted
    # Deploy only when triggered manually, or when the gating CI run passed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # For workflow_run, check out the exact commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) Build the React frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # 2) Install backend PRODUCTION deps and fold the React build into it,
      #    so the deployed package is self-contained (no build on App Service).
      - name: Install backend dependencies (production only)
        working-directory: backend
        run: npm ci --omit=dev

      - name: Copy React build into backend/public
        run: node scripts/copy-frontend.js

      # 3) Log in to Azure with OIDC (short-lived token, no stored secret)
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3b) Set the runtime App Settings (environment variables) the Express app
      #     reads from process.env. DB_* come from repository secrets (create:
      #     DB_HOST, DB_USER, DB_PASSWORD, DB_NAME). Non-secret values are literal.
      - name: Configure App Settings (vt-nodeapp-01)
        shell: powershell
        run: >
          az webapp config appsettings set
          --name ${{ env.NODE_WEBAPP_NAME }}
          --resource-group ${{ env.RESOURCE_GROUP }}
          --settings
          DB_HOST="${{ secrets.DB_HOST }}"
          DB_PORT="3306"
          DB_USER="${{ secrets.DB_USER }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          DB_NAME="${{ secrets.DB_NAME }}"
          DB_SSL="true"
          FRONTEND_ORIGIN="${{ env.NODE_APP_URL }}"

      # 4) Deploy the backend folder (Express serves the API + the React build)
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.NODE_WEBAPP_NAME }}
          package: backend

  # ---------------------------------------------------------------------------
  # PHP documentation app  ->  vt-phpapp-02
  # ---------------------------------------------------------------------------
  deploy-php:
    name: Deploy PHP docs app (vt-phpapp-02)
    runs-on: self-hosted
    # Deploy only when triggered manually, or when the gating CI run passed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # For workflow_run, check out the exact commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # 1) Build the PHP app: package the single self-contained docs file as the
      #    site root (index.php). Plain file copy — no PHP toolchain needed.
      - name: Package the docs app (index.php)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path docs-dist | Out-Null
          Copy-Item frontend/public/api-docs.php docs-dist/index.php -Force

      # 2) Log in to Azure with OIDC
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 2b) Set the docs' App Settings. api-docs.php reads BASE_URL/PORTAL_URL via
      #     getenv() and falls back to localhost only when unset.
      - name: Configure App Settings (vt-phpapp-02)
        shell: powershell
        run: >
          az webapp config appsettings set
          --name ${{ env.PHP_WEBAPP_NAME }}
          --resource-group ${{ env.RESOURCE_GROUP }}
          --settings
          BASE_URL="${{ env.NODE_APP_URL }}"
          PORTAL_URL="${{ env.NODE_APP_URL }}"

      # 3) Deploy the packaged docs folder
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.PHP_WEBAPP_NAME }}
          package: docs-dist

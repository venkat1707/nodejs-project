name: Deploy to Azure App Service

# Continuous Deployment for Swiftcart.
#   - Node.js app (Express + React build)  ->  App Service  vt-nodeapp-01
#   - PHP documentation app                ->  App Service  vt-phpapp-02
# Both apps live in resource group vt-nodejs-rg.
#
# Auth: OpenID Connect (OIDC) — no stored password. Uses the repository secrets
#   AZURE_CLIENT_ID        (service principal / app registration client id)
#   AZURE_TENANT_ID        (Entra ID tenant id)
#   AZURE_SUBSCRIPTION_ID  (subscription that hosts the App Services)
#
# This pipeline is Azure-CLI-free: it uses Azure PowerShell (the Az modules),
# installed user-scoped (Install-Module -Scope CurrentUser, no admin), so it
# works on a locked-down self-hosted runner (e.g. one running as NETWORK
# SERVICE). Login is done with Connect-AzAccount -FederatedToken (OIDC),
# App Settings via Set-AzWebApp, and deployment via Publish-AzWebApp (zip).
#
# Trigger: this deploy is GATED on the CI workflow. It runs automatically only
# after the "CI" workflow completes successfully on `main` (workflow_run), and
# deploys the exact commit that CI validated. You can also start it manually
# (workflow_dispatch) — a manual run skips the CI-success gate on purpose.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# OIDC needs permission to request a federated token.
permissions:
  id-token: write
  contents: read

env:
  NODE_WEBAPP_NAME: vt-nodeapp-01
  PHP_WEBAPP_NAME: vt-phpapp-02
  RESOURCE_GROUP: vt-nodejs-rg
  # Public URL of the Node app; used for the PHP docs' BASE_URL/PORTAL_URL and
  # the Node app's own CORS FRONTEND_ORIGIN. Change if you use a custom domain.
  NODE_APP_URL: https://vt-nodeapp-01.azurewebsites.net

jobs:
  # ---------------------------------------------------------------------------
  # Node.js app  ->  vt-nodeapp-01
  # ---------------------------------------------------------------------------
  deploy-node:
    name: Deploy Node app (vt-nodeapp-01)
    runs-on: self-hosted
    # Deploy only when triggered manually, or when the gating CI run passed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # For workflow_run, check out the exact commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) Build the React frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # 2) Fold the React build into the backend's public folder. Backend npm
      #    dependencies are NOT shipped — they are installed on Azure by Oryx
      #    during deployment (SCM_DO_BUILD_DURING_DEPLOYMENT below), which builds
      #    Linux-native modules and keeps the uploaded zip small and reliable.
      - name: Copy React build into backend/public
        run: node scripts/copy-frontend.js

      # 3) Ensure Azure PowerShell (Az) is available. Installed user-scoped, so
      #    no admin rights are needed (works even as NETWORK SERVICE).
      - name: Ensure Azure PowerShell (Az) is available
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
            Write-Host "Installing NuGet package provider (CurrentUser)..."
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          }
          if (-not (Get-Module -ListAvailable -Name Az.Accounts)) {
            Write-Host "Installing Az.Accounts (CurrentUser)..."
            Install-Module -Name Az.Accounts -Scope CurrentUser -Repository PSGallery -Force -AllowClobber
          }
          if (-not (Get-Module -ListAvailable -Name Az.Websites)) {
            Write-Host "Installing Az.Websites (CurrentUser)..."
            Install-Module -Name Az.Websites -Scope CurrentUser -Repository PSGallery -Force -AllowClobber
          }
          Write-Host "Az modules ready."

      # 4) OIDC login + App Settings + zip deploy — all via Azure PowerShell.
      #    DB_* come from repository secrets (create: DB_HOST, DB_USER,
      #    DB_PASSWORD, DB_NAME). Non-secret values are set as literals.
      - name: Configure settings and deploy (vt-nodeapp-01)
        shell: powershell
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ env.NODE_WEBAPP_NAME }}
          NODE_APP_URL: ${{ env.NODE_APP_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Az.Accounts
          Import-Module Az.Websites

          # a) OIDC: request a GitHub federated token and sign in (no az, no secret).
          $audience = 'api://AzureADTokenExchange'
          $uri = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$([uri]::EscapeDataString($audience))"
          $idToken = (Invoke-RestMethod -Uri $uri -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }).value
          Connect-AzAccount -ServicePrincipal -ApplicationId $env:AZURE_CLIENT_ID -TenantId $env:AZURE_TENANT_ID -FederatedToken $idToken -Subscription $env:AZURE_SUBSCRIPTION_ID | Out-Null

          # b) Merge App Settings (preserve any existing values on the app).
          $app = Get-AzWebApp -ResourceGroupName $env:RESOURCE_GROUP -Name $env:WEBAPP_NAME
          $settings = @{}
          if ($app.SiteConfig -and $app.SiteConfig.AppSettings) {
            foreach ($s in $app.SiteConfig.AppSettings) {
              if ($null -ne $s.Value) { $settings[$s.Name] = [string]$s.Value }
            }
          }
          function Add-Setting($key, $value) {
            if ([string]::IsNullOrEmpty($value)) { Write-Host "::warning::Skipping app setting '$key' (no value provided; set the matching repository secret)."; return }
            $settings[$key] = [string]$value
          }
          Add-Setting 'DB_HOST'         $env:DB_HOST
          Add-Setting 'DB_PORT'         '3306'
          Add-Setting 'DB_USER'         $env:DB_USER
          Add-Setting 'DB_PASSWORD'     $env:DB_PASSWORD
          Add-Setting 'DB_NAME'         $env:DB_NAME
          Add-Setting 'DB_SSL'          'true'
          Add-Setting 'FRONTEND_ORIGIN' $env:NODE_APP_URL
          # Build backend deps on Azure (Oryx) during zip deploy, so node_modules
          # is Linux-native and we don't ship it from a Windows runner.
          Add-Setting 'SCM_DO_BUILD_DURING_DEPLOYMENT' 'true'
          Set-AzWebApp -ResourceGroupName $env:RESOURCE_GROUP -Name $env:WEBAPP_NAME -AppSettings $settings | Out-Null

          # b2) Ensure the Linux runtime stack is Node (this is an Express app).
          #     If the app was created with a non-Node stack, the container can
          #     never start the server. Force NODE|20-lts when it isn't Node.
          try {
            $web = Get-AzResource -ResourceId "$($app.Id)/config/web" -ApiVersion 2022-03-01 -ErrorAction Stop
            $current = [string]$web.Properties.linuxFxVersion
            Write-Host "Current linuxFxVersion: '$current'"
            if ($current -notlike 'NODE|*') {
              Write-Host "Setting linuxFxVersion to 'NODE|20-lts'."
              $web.Properties.linuxFxVersion = 'NODE|20-lts'
              $web | Set-AzResource -ApiVersion 2022-03-01 -Force | Out-Null
            }
          } catch {
            Write-Host "::warning::Could not read/set linuxFxVersion: $($_.Exception.Message)"
          }

          # c) Zip the backend SOURCE (no node_modules) and deploy it. Oryx runs
          #    `npm install` on the server because of the setting above.
          $zip = Join-Path $env:RUNNER_TEMP 'node-app.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          if (Test-Path 'backend\node_modules') { Remove-Item 'backend\node_modules' -Recurse -Force }
          Compress-Archive -Path 'backend\*' -DestinationPath $zip -Force
          Publish-AzWebApp -ResourceGroupName $env:RESOURCE_GROUP -Name $env:WEBAPP_NAME -ArchivePath $zip -Force | Out-Null
          Write-Host "Deployed $env:WEBAPP_NAME."

      # 5) Diagnostics: print the runtime stack and the latest container log so
      #    a startup failure is visible directly in this Actions run. Runs even
      #    if a previous step failed.
      - name: Show runtime config and container log (vt-nodeapp-01)
        if: always()
        shell: powershell
        env:
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ env.NODE_WEBAPP_NAME }}
        run: |
          $ErrorActionPreference = 'Continue'
          Import-Module Az.Accounts
          Import-Module Az.Websites
          try {
            $app = Get-AzWebApp -ResourceGroupName $env:RESOURCE_GROUP -Name $env:WEBAPP_NAME
            Write-Host "LinuxFxVersion : $($app.SiteConfig.LinuxFxVersion)"
            Write-Host "AppCommandLine : $($app.SiteConfig.AppCommandLine)"
            Write-Host "State          : $($app.State)"
          } catch { Write-Host "Could not read site config: $($_.Exception.Message)" }
          try {
            $tok = Get-AzAccessToken -ResourceUrl 'https://management.azure.com/'
            $token = if ($tok.Token -is [System.Security.SecureString]) { [System.Net.NetworkCredential]::new('', $tok.Token).Password } else { $tok.Token }
            $base = "https://$($env:WEBAPP_NAME).scm.azurewebsites.net"
            $hdr = @{ Authorization = "Bearer $token" }
            $list = Invoke-RestMethod -Uri "$base/api/vfs/LogFiles/" -Headers $hdr
            $docker = $list | Where-Object { $_.name -like '*docker*.log' } | Sort-Object mtime -Descending | Select-Object -First 1
            if ($docker) {
              Write-Host "----- $($docker.name) (last 120 lines) -----"
              $content = Invoke-RestMethod -Uri $docker.href -Headers $hdr
              ($content -split "`n" | Select-Object -Last 120) | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host "No *docker*.log found. Files under LogFiles:"
              $list | ForEach-Object { Write-Host " - $($_.name)" }
            }
          } catch { Write-Host "Failed to fetch container log from Kudu: $($_.Exception.Message)" }

  # ---------------------------------------------------------------------------
  # PHP documentation app  ->  vt-phpapp-02
  # ---------------------------------------------------------------------------
  deploy-php:
    name: Deploy PHP docs app (vt-phpapp-02)
    runs-on: self-hosted
    # Deploy only when triggered manually, or when the gating CI run passed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # For workflow_run, check out the exact commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # 1) Build the PHP app: package the single self-contained docs file as the
      #    site root (index.php). Plain file copy — no PHP toolchain needed.
      - name: Package the docs app (index.php)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path docs-dist | Out-Null
          Copy-Item frontend/public/api-docs.php docs-dist/index.php -Force

      # 2) Ensure Azure PowerShell (Az) is available (user-scoped, no admin).
      - name: Ensure Azure PowerShell (Az) is available
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
            Write-Host "Installing NuGet package provider (CurrentUser)..."
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          }
          if (-not (Get-Module -ListAvailable -Name Az.Accounts)) {
            Write-Host "Installing Az.Accounts (CurrentUser)..."
            Install-Module -Name Az.Accounts -Scope CurrentUser -Repository PSGallery -Force -AllowClobber
          }
          if (-not (Get-Module -ListAvailable -Name Az.Websites)) {
            Write-Host "Installing Az.Websites (CurrentUser)..."
            Install-Module -Name Az.Websites -Scope CurrentUser -Repository PSGallery -Force -AllowClobber
          }
          Write-Host "Az modules ready."

      # 3) OIDC login + App Settings + zip deploy — all via Azure PowerShell.
      - name: Configure settings and deploy (vt-phpapp-02)
        shell: powershell
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ env.PHP_WEBAPP_NAME }}
          NODE_APP_URL: ${{ env.NODE_APP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Az.Accounts
          Import-Module Az.Websites

          # a) OIDC login.
          $audience = 'api://AzureADTokenExchange'
          $uri = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$([uri]::EscapeDataString($audience))"
          $idToken = (Invoke-RestMethod -Uri $uri -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }).value
          Connect-AzAccount -ServicePrincipal -ApplicationId $env:AZURE_CLIENT_ID -TenantId $env:AZURE_TENANT_ID -FederatedToken $idToken -Subscription $env:AZURE_SUBSCRIPTION_ID | Out-Null

          # b) Merge App Settings (api-docs.php reads BASE_URL/PORTAL_URL via getenv()).
          $app = Get-AzWebApp -ResourceGroupName $env:RESOURCE_GROUP -Name $env:WEBAPP_NAME
          $settings = @{}
          if ($app.SiteConfig -and $app.SiteConfig.AppSettings) {
            foreach ($s in $app.SiteConfig.AppSettings) {
              if ($null -ne $s.Value) { $settings[$s.Name] = [string]$s.Value }
            }
          }
          function Add-Setting($key, $value) {
            if ([string]::IsNullOrEmpty($value)) { Write-Host "::warning::Skipping app setting '$key' (no value provided)."; return }
            $settings[$key] = [string]$value
          }
          Add-Setting 'BASE_URL'   $env:NODE_APP_URL
          Add-Setting 'PORTAL_URL' $env:NODE_APP_URL
          Set-AzWebApp -ResourceGroupName $env:RESOURCE_GROUP -Name $env:WEBAPP_NAME -AppSettings $settings | Out-Null

          # c) Zip the packaged docs folder and deploy it.
          $zip = Join-Path $env:RUNNER_TEMP 'php-docs.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'docs-dist\*' -DestinationPath $zip -Force
          Publish-AzWebApp -ResourceGroupName $env:RESOURCE_GROUP -Name $env:WEBAPP_NAME -ArchivePath $zip -Force | Out-Null
          Write-Host "Deployed $env:WEBAPP_NAME."

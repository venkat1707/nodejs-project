name: CI

# Continuous Integration for Swiftcart.
# Runs on every push and on pull requests into main. It installs dependencies,
# builds the React frontend, verifies the backend, assembles the deployable
# bundle (the same steps as `npm run build:deploy`), and builds the PHP docs
# app (packaged as a deployable index.php), linting it when PHP is available.
# This is CI only — it does not deploy. Deployment lives in a separate CD workflow.
#
# Runner note: all jobs run on a self-hosted runner (`runs-on: self-hosted`).
# Ensure the runner has Node 20 and PHP available (or let the setup-node /
# setup-php steps provision them). To use GitHub-hosted runners instead,
# change `runs-on: self-hosted` to `runs-on: ubuntu-latest`.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & verify (Node)
    runs-on: self-hosted

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---- Frontend (React + Vite) ----
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend (if a lint script exists)
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ---- Backend (Express) ----
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax-check backend entry point
        working-directory: backend
        run: node --check src/server.js

      - name: Lint backend (if a lint script exists)
        working-directory: backend
        run: npm run lint --if-present

      - name: Test backend (if a test script exists)
        working-directory: backend
        run: npm test --if-present

      # ---- Assemble the deployable bundle (mirrors `npm run build:deploy`) ----
      - name: Copy React build into backend/public
        run: node scripts/copy-frontend.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiftcart-build
          path: backend/public
          if-no-files-found: error
          retention-days: 7

  php-docs:
    name: Build & lint PHP docs
    runs-on: self-hosted

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Build the PHP app: package the single self-contained file as the site
      # root (index.php), exactly as the deploy steps do. This is a plain file
      # copy and needs no PHP toolchain.
      - name: Build the docs app (package as index.php)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path docs-dist | Out-Null
          Copy-Item frontend/public/api-docs.php docs-dist/index.php -Force

      # Lint with PHP only if a php executable is on the runner's PATH.
      # shivammathur/setup-php is intentionally NOT used: on Windows it requires
      # PowerShell 7 (pwsh), which is not installed on this self-hosted runner.
      - name: Lint the documentation page (if PHP is available)
        shell: powershell
        run: |
          $php = Get-Command php -ErrorAction SilentlyContinue
          if ($php) {
            Write-Host "Linting with $($php.Source)"
            php -l docs-dist/index.php
          } else {
            Write-Host "PHP not found on PATH - skipping lint. Add php to the runner PATH (or install PowerShell 7 so setup-php can run) to enable it."
          }

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiftcart-docs
          path: docs-dist
          if-no-files-found: error
          retention-days: 7
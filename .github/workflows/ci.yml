name: CI

# Continuous Integration for Swiftcart.
# Runs on every push and on pull requests into main. It installs dependencies,
# builds the React frontend, verifies the backend, assembles the deployable
# bundle (the same steps as `npm run build:deploy`), and builds + lints the PHP
# docs app (packaged as a deployable index.php).
# This is CI only — it does not deploy. Deployment lives in a separate CD workflow.
#
# Runner note: all jobs run on a self-hosted runner (`runs-on: self-hosted`).
# Ensure the runner has Node 20 and PHP available (or let the setup-node /
# setup-php steps provision them). To use GitHub-hosted runners instead,
# change `runs-on: self-hosted` to `runs-on: ubuntu-latest`.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & verify (Node)
    runs-on: self-hosted

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---- Frontend (React + Vite) ----
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend (if a lint script exists)
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ---- Backend (Express) ----
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax-check backend entry point
        working-directory: backend
        run: node --check src/server.js

      - name: Lint backend (if a lint script exists)
        working-directory: backend
        run: npm run lint --if-present

      - name: Test backend (if a test script exists)
        working-directory: backend
        run: npm test --if-present

      # ---- Assemble the deployable bundle (mirrors `npm run build:deploy`) ----
      - name: Copy React build into backend/public
        run: node scripts/copy-frontend.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiftcart-build
          path: backend/public
          if-no-files-found: error
          retention-days: 7

  php-docs:
    name: Build & lint PHP docs
    runs-on: self-hosted

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      # Verify the docs file parses cleanly.
      - name: Lint the documentation page
        run: php -l frontend/public/api-docs.php

      # "Build" the PHP app: package the single self-contained file as the
      # site root (index.php) exactly as the deploy steps do. `php -r` is used
      # so the command is shell-agnostic (works on PowerShell and bash runners).
      - name: Build the docs app (package as index.php)
        run: php -r "@mkdir('docs-dist'); if (!copy('frontend/public/api-docs.php', 'docs-dist/index.php')) { exit(1); }"

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiftcart-docs
          path: docs-dist
          if-no-files-found: error
          retention-days: 7